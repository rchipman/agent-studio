[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
keyring = { version = "4.1.1", features = ["apple-native-keyring-store"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# TIN-1759: durable session archive — zstd compression of session transcripts
# (write-once / read-rarely, so we compress at a high ratio level).
zstd = "0.13"
# sqlite-vec: vector-search SQLite extension, statically linked into the bundled
# SQLite build. Registered as a SQLite auto-extension at process startup (see
# search::register_sqlite_vec) — no dynamic .so/.dylib to ship.
sqlite-vec = "0.1.9"
gray_matter = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# TIN-1631: embedding client — HTTP (rustls, no native-tls) + SHA-256.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# TIN-1691: local (in-process) embeddings via candle — pure-Rust BERT inference,
# no ONNX/Python. Model weights fetched once via hf-hub, then fully offline.
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"
# Sync HTTP for one-time model-weight download (no async runtime needed, so it's
# safe to call from any thread). Model files cache under the app data dir.
ureq = "2"
# E2E only (TIN-1645): embeds a W3C WebDriver server (port 4445) so WebdriverIO
# can drive the real app. Behind the `webdriver` feature so it is entirely
# excluded from normal dev/release builds — build E2E with `--features webdriver`.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[features]
webdriver = ["dep:tauri-plugin-webdriver"]
